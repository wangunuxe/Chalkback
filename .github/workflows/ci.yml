# 每个 PR 和每次推送到 main 都跑 make check（契约自检 + 全部组件测试）。
# 测试失败时 PR 会显示红叉；在 GitHub 的分支保护里把这个检查设为必需，就能挡住坏改动进 main。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 是 doctor.py 对老师承诺的最低版本
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            console/requirements.txt
            hub/requirements.txt
            pipe/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: make check
        run: make check PY=python
