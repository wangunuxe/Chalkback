# Development and test environment: school Hub + teacher console (mock data).
#
#   docker compose up --build
#   Hub      https://localhost:8443      (API docs at /docs)
#   Console  https://localhost:4000      (bound to localhost only)
#
# Not included here: screenpipe (a desktop app that records the teacher's microphone and screen) and chalkback-pipe (started by screenpipe).
# They can only run on the teacher's computer; see docs/SETUP.md.

name: chalkback

services:
  hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    ports:
      - "8443:8000"
    environment:
      # Test mode: accepts mock-token-<id> and enables the DEMO-* invite codes (the console's mock config uses mock-token-T1).
      # Only for local testing; do not set it for public deployment (off by default in hub/Dockerfile); see docs/ADMIN.md.
      HUB_MOCK_AUTH: "1"
    volumes:
      - hub-data:/data
    networks: [chalkback]

  console:
    build:
      context: .
      dockerfile: console/Dockerfile
    # Must be bound to 127.0.0.1 only: CONSOLE_TRUSTED_NETS below makes the teacher pages trust the container network,
    # so if the port were open to the LAN, the teacher pages would be open to everyone.
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      CONSOLE_TRUSTED_NETS: 172.28.0.0/16
      HUB_URL: https://hub:8000
    volumes:
      - console-data:/data   # fake ~/.chalkback; regenerated as mock after docker compose down -v
    depends_on:
      hub:
        condition: service_healthy
    networks: [chalkback]

networks:
  chalkback:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  hub-data:
  console-data:
